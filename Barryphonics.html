<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語發音聽力學習中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E4; --bg-soft:#FBF7EE; --card:#FFFFFF;
    --ink:#3B3A46; --ink-soft:#8A8797; --line:#EEE7D6;
    --amber:#F5A623; --amber-d:#E7951A;
    --purple:#7C5CE0; --purple2:#9A6BF2;
    --good:#2B9C6A; --good-bg:#E7F7EF; --bad:#E5556E; --bad-bg:#FCEAEE;
    --r:20px; --r-sm:14px;
    --sh:0 10px 30px -12px rgba(60,50,90,.18);
    --sh-soft:0 4px 14px -6px rgba(60,50,90,.14);
    --disp:"Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cjk:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--cjk);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding:8px 12px 16px}
  .wrap{max-width:960px;margin:0 auto}

  .topbar{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-soft);padding:8px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .logo{width:46px;height:46px;border-radius:13px;flex:0 0 auto;background:linear-gradient(135deg,#F5A623,#F57C23);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:18px;box-shadow:0 6px 14px -6px rgba(245,124,35,.7)}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--ink-soft);font-family:var(--disp);letter-spacing:.4px}
  .voice-seg{display:inline-flex;background:#FBF3E1;border:1px solid #F1E1BD;border-radius:999px;padding:3px}
  .voice-seg button{border:0;background:transparent;color:#B87C15;font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;font-family:inherit}
  .voice-seg button.on{background:var(--amber);color:#fff;box-shadow:0 3px 8px -3px rgba(245,166,35,.8)}
  .speed-pill{display:flex;align-items:center;gap:8px;background:#FBF3E1;color:#B87C15;border:1px solid #F1E1BD;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
  .speed-pill input[type=range]{width:80px;accent-color:var(--amber)}

  .hero{text-align:center;margin:14px 0 4px}
  .hero h2{font-size:23px;margin:0;font-weight:700}
  .hero .sub{color:var(--ink-soft);font-size:13.5px;margin-top:5px}

  .cat-head{display:flex;align-items:center;gap:12px;margin:16px 2px 9px;color:var(--ink);font-weight:700;font-size:15px}
  .cat-head span{white-space:nowrap}
  .cat-head::after{content:"";flex:1;height:1px;background:var(--line)}

  .grid{display:grid;gap:11px}
  .grid.units{grid-template-columns:repeat(3,1fr)}
  .grid.g5{grid-template-columns:repeat(5,1fr)}
  .grid.g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:820px){.grid.g5{grid-template-columns:repeat(2,1fr)}.grid.units{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.grid.g5,.grid.units{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;text-align:center;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh-soft);transition:transform .14s ease, box-shadow .14s ease}
  .card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--accent)}
  .card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .ipa{display:inline-block;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff);border:1px solid color-mix(in srgb,var(--accent) 28%,#fff);padding:2px 12px;border-radius:999px;margin-bottom:9px}
  .card h3{font-family:var(--disp);font-size:19px;margin:0 0 5px;font-weight:600}
  .egs{font-family:var(--disp);color:var(--ink-soft);font-size:12.5px;min-height:16px}
  .best{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft)}
  .best b{color:var(--ink);font-family:var(--disp)}

  .banner{display:flex;align-items:center;gap:14px;border-radius:var(--r);padding:12px 20px;cursor:pointer;color:#fff;box-shadow:var(--sh);transition:transform .14s ease;margin-top:10px}
  .banner:hover{transform:translateY(-3px)}
  .banner:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .banner .ic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:21px;flex:0 0 auto}
  .banner .tx{flex:1 1 auto}
  .banner .tx h3{margin:0;font-size:17px;font-weight:700}
  .banner .tx p{margin:3px 0 0;font-size:12.5px;opacity:.92}
  .banner .sc{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;font-family:var(--disp);white-space:nowrap}
  .banner .arw{font-size:22px;opacity:.9}
  .extra-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:10px}
  @media(max-width:640px){.extra-row{grid-template-columns:1fr}}
  .extra-row .banner{margin-top:0}

  .bar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-soft);padding:8px 15px;display:flex;align-items:center;gap:12px;margin-top:10px}
  .bar .back{background:transparent;border:0;color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;padding:6px 4px;font-family:inherit}
  .bar .back:hover{color:var(--ink)}
  .btn{border:1px solid #E0D6F5;background:#F3EEFC;color:#6B4FC7;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:#ece3fb}
  .tag{margin:0 auto;font-weight:700;font-size:13px;padding:6px 16px;border-radius:999px;background:#FBF3E1;color:#B87C15}
  .qcount{font-family:var(--disp);font-weight:600;color:var(--ink-soft);font-size:14px}
  .progress{height:9px;background:#EDE7D8;border-radius:999px;margin:9px 2px 0;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#F5C623);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

  .stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-soft);padding:16px 20px;margin-top:11px;text-align:center}
  .prompt{color:var(--ink-soft);font-size:13.5px;margin-bottom:9px}
  .showword{font-family:var(--disp);font-size:36px;font-weight:600;letter-spacing:1px;margin:2px 0 10px}
  .speaker{width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;margin:2px auto 0;display:grid;place-items:center;background:radial-gradient(circle at 30% 28%,#FDBE4A,var(--amber));color:#fff;box-shadow:0 14px 30px -10px rgba(245,166,35,.85);transition:transform .12s ease;position:relative}
  .speaker:hover{transform:scale(1.05)}
  .speaker:active{transform:scale(.96)}
  .speaker:focus-visible{outline:4px solid #F5C623;outline-offset:4px}
  .speaker.ping::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--amber);opacity:.6;animation:ping .6s ease-out}
  @keyframes ping{to{transform:scale(1.4);opacity:0}}
  .speaker svg{width:33px;height:33px}
  .replay-hint{display:inline-flex;gap:6px;align-items:center;background:#37343F;color:#fff;font-size:11.5px;padding:5px 11px;border-radius:999px;margin-top:8px;font-weight:600}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
  .opts.five{grid-template-columns:repeat(3,1fr)}
  @media(max-width:560px){.opts,.opts.five{grid-template-columns:1fr 1fr}}
  .opt{background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:14px;font-family:var(--disp);font-size:20px;font-weight:500;color:var(--ink);cursor:pointer;transition:transform .1s ease,border-color .15s ease,background .15s ease;position:relative}
  .opt .num{position:absolute;top:8px;left:10px;font-size:11px;color:var(--ink-soft);font-weight:600;background:#F4F0E5;border-radius:6px;padding:1px 6px}
  .opt .vlabel{display:block;font-size:13px;color:var(--ink-soft);font-weight:500;margin-top:4px}
  .opt:hover:not(.locked){transform:translateY(-2px);border-color:var(--amber)}
  .opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .opt.correct{border-color:var(--good);background:var(--good-bg);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .opt.locked{cursor:default}
  .opt.dim{opacity:.5}

  .feedback{margin-top:12px;border-radius:var(--r-sm);padding:12px 16px;display:none;align-items:center;gap:14px;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .feedback.show{display:flex}
  .feedback.ok{background:var(--good-bg);border:1px solid #BEE9D3}
  .feedback.no{background:var(--bad-bg);border:1px solid #F4C9D2}
  .feedback .fic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:21px;flex:0 0 auto}
  .feedback.ok .fic{background:var(--good)}
  .feedback.no .fic{background:var(--bad)}
  .feedback .ft{flex:1 1 auto;text-align:left}
  .feedback .ft small{display:block;color:var(--ink-soft);margin-top:2px;font-size:12.5px}
  .feedback .kk{color:var(--ink-soft);font-family:var(--disp)}
  .feedback .fbtns{display:flex;gap:8px;flex:0 0 auto}
  .mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit}
  .mini:hover{background:#FBF7EE}
  .next{border:0;background:var(--amber);color:#fff;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(245,166,35,.8);font-family:inherit}
  .next:hover{background:var(--amber-d)}

  .result{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;margin-top:11px;text-align:center}
  .ring{width:118px;height:118px;margin:4px auto 8px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center}
  .ring .val b{font-family:var(--disp);font-size:32px;line-height:1}
  .ring .val span{font-size:12px;color:var(--ink-soft)}
  .result h2{margin:6px 0 2px;font-size:22px}
  .result .msg{color:var(--ink-soft);font-size:14px;margin-bottom:6px}
  .review{text-align:left;margin:16px auto 0;max-width:520px}
  .review h4{font-size:14px;margin:0 0 10px;color:var(--ink)}
  .rrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#FBF7EE}
  .rrow .rsp{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;border:0}
  .rrow .rsp svg{width:15px;height:15px}
  .rrow .rw{font-family:var(--disp);font-weight:600;font-size:17px}
  .rrow .rkk{color:var(--ink-soft);font-size:12.5px;font-family:var(--disp)}
  .rrow .rv{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .rbtns button{border:0;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .rp{background:var(--amber);color:#fff}.rp:hover{background:var(--amber-d)}
  .rs{background:#F3EEFC;color:#6B4FC7;border:1px solid #E0D6F5!important}
  .rg{background:#EFF6F2;color:#1F9E7A;border:1px solid #CDE9DE!important}

  .overlay{position:fixed;inset:0;background:rgba(45,40,60,.5);display:none;align-items:flex-start;justify-content:center;padding:26px 14px;z-index:50;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--bg-soft);border-radius:var(--r);max-width:920px;width:100%;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
  .mhead{background:linear-gradient(100deg,#F5A623,#F5871F);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0}
  .mhead h3{margin:0;font-size:17px;font-weight:700;flex:1 1 auto}
  .mhead .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
  .mhead .x:hover{background:rgba(255,255,255,.4)}
  .mcols{display:grid;gap:10px;padding:14px}
  @media(max-width:780px){.mcols{grid-template-columns:repeat(2,1fr)!important}}
  @media(max-width:460px){.mcols{grid-template-columns:1fr!important}}
  .mcol{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;border-top:4px solid var(--accent)}
  .mcol h4{margin:0 0 10px;text-align:center;font-family:var(--disp);font-size:15px;color:var(--accent)}
  .wline{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
  .wline:hover{background:color-mix(in srgb,var(--accent) 8%,#fff)}
  .wline .w{font-family:var(--disp);font-weight:500;font-size:15px}
  .wline .kk{color:var(--ink-soft);font-size:11px;font-family:var(--disp)}
  .wline .sp{margin-left:auto;color:var(--accent);width:22px;height:22px;display:grid;place-items:center}
  .wline .sp svg{width:15px;height:15px}
  .mfoot{text-align:center;color:var(--ink-soft);font-size:12px;padding:6px 14px 16px}

  .foot{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:16px;font-family:var(--disp)}
  .hidden{display:none!important}
  .warn{background:#FCEAEE;border:1px solid #F4C9D2;color:#B23A50;border-radius:12px;padding:12px 16px;font-size:13px;margin-top:14px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="logo">abc</div>
      <div><h1>英語發音聽力學習中心</h1><p>Phonics Listening Hub</p></div>
    </div>
    <div class="voice-seg" role="group" aria-label="選擇語音">
      <button id="vf" class="on" onclick="setVoice('female')">👩 女聲</button>
      <button id="vm" onclick="setVoice('male')">👨 男聲</button>
    </div>
    <div class="speed-pill">
      <span>⏱️ 語速</span>
      <input id="rate" type="range" min="0.5" max="1.2" step="0.1" value="1" oninput="setRate(this.value)" aria-label="語速">
      <b id="rateVal" style="font-family:var(--disp)">1.0x</b>
    </div>
  </header>

  <!-- HOME : categories -> units -->
  <section id="home">
    <div class="hero"><h2>選擇學習單元 🎯</h2><div class="sub">先挑一個發音主題，再選擇練習模式。聆聽發音，找出正確答案！</div></div>
    <div id="catList"></div>
  </section>

  <!-- UNIT HOME : targets + modes -->
  <section id="unit" class="hidden">
    <div class="bar">
      <button class="back" onclick="goHome()">← 返回主選單</button>
      <span class="tag" id="unitTag"></span>
      <button class="btn" onclick="openList()">📖 單字總表</button>
    </div>
    <div class="hero" style="margin-top:12px"><h2 id="unitTitle"></h2><div class="sub" id="unitSub"></div></div>
    <div id="targetGrid" class="grid"></div>
    <div id="modeRow"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="bar">
      <button class="back" onclick="backToUnit()">← 返回單元</button>
      <span class="tag" id="qtag"></span>
      <span class="qcount" id="qcount">題目 1 / 10</span>
    </div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="stage">
      <div class="prompt" id="prompt"></div>
      <div class="showword hidden" id="showword"></div>
      <button class="speaker" id="spk" onclick="replay()" aria-label="播放發音">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
      </button>
      <div><span class="replay-hint">🔊 按我發音</span></div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <section id="result" class="hidden"></section>

  <div class="foot">英語發音聽力學習中心 © 2026 · Phonics Listening Hub</div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeList()">
  <div class="modal">
    <div class="mhead"><span>📖</span><h3 id="listTitle">單字對照總表</h3><button class="x" onclick="closeList()" aria-label="關閉">✕</button></div>
    <div class="mcols" id="mcols"></div>
    <div class="mfoot">點擊任一單字即可聆聽發音與對照 KK 音標</div>
  </div>
</div>

<script>
/* ==================================================================
   CONTENT LAYER — 單元契約 (Unit Contract)
   每個單元 = 資料 + 宣告要用的題型 + 主題色。不含任何邏輯。
   target = 這個單元教的一個「音」(分類)，底下掛它的單字庫。
   ================================================================== */
const CATEGORIES = [
  {id:'vowels',     title:'母音 Vowels'},
  {id:'consonants', title:'子音 Consonants'},
];

const UNITS = [
  {
    id:'short-vowels', category:'vowels', title:'短母音', subtitle:'Short Vowels',
    accent:'#E8688F', modes:['mix','classify','minimal'],
    classifyLabel:'母音分類', classifyPrompt:'看單字、聽發音，選出正確的短母音：',
    targets:[
      {key:'a',label:'short A',symbol:'/æ/',color:'#E8688F',words:[['man','mæn'],['mad','mæd'],['map','mæp'],['mask','mæsk'],['lab','læb'],['fast','fæst'],['hand','hænd'],['ask','æsk'],['and','ænd'],['cat','kæt']]},
      {key:'e',label:'short E',symbol:'/ɛ/',color:'#8A6BD6',words:[['get','gɛt'],['egg','ɛg'],['net','nɛt'],['wet','wɛt'],['set','sɛt'],['jet','dʒɛt'],['left','lɛft'],['desk','dɛsk'],['men','mɛn'],['help','hɛlp']]},
      {key:'i',label:'short I',symbol:'/ɪ/',color:'#E8963F',words:[['big','bɪg'],['dig','dɪg'],['hit','hɪt'],['will','wɪl'],['fix','fɪks'],['hill','hɪl'],['did','dɪd'],['sit','sɪt'],['kid','kɪd'],['lift','lɪft']]},
      {key:'o',label:'short O',symbol:'/ɑ/',color:'#37AE86',words:[['not','nɑt'],['dot','dɑt'],['got','gɑt'],['hot','hɑt'],['rock','rɑk'],['smog','smɑg'],['fog','fɑg'],['log','lɑg'],['hop','hɑp'],['lot','lɑt']]},
      {key:'u',label:'short U',symbol:'/ʌ/',color:'#4A9BD4',words:[['up','ʌp'],['sun','sʌn'],['jump','dʒʌmp'],['fun','fʌn'],['bus','bʌs'],['run','rʌn'],['bun','bʌn'],['bug','bʌg'],['hug','hʌg'],['mud','mʌd']]},
    ]
  },
  {
    id:'long-vowels', category:'vowels', title:'長母音', subtitle:'Long Vowels',
    accent:'#2AA57E', modes:['mix','classify','minimal'],
    classifyLabel:'母音分類', classifyPrompt:'看單字、聽發音，選出正確的長母音：',
    targets:[
      {key:'ay',label:'long A',symbol:'/eɪ/',color:'#E08A2B',words:[['cake','kek'],['name','nem'],['game','gem'],['rain','ren'],['wait','wet'],['day','de'],['play','ple'],['gate','get'],['late','let'],['cave','kev']]},
      {key:'ee',label:'long E',symbol:'/iː/',color:'#2AA57E',words:[['see','si'],['tree','tri'],['green','grin'],['sheep','ʃip'],['read','rid'],['meat','mit'],['team','tim'],['feet','fit'],['bee','bi'],['leaf','lif']]},
      {key:'iy',label:'long I',symbol:'/aɪ/',color:'#6C5CE0',words:[['bike','baɪk'],['kite','kaɪt'],['time','taɪm'],['nine','naɪn'],['line','laɪn'],['ride','raɪd'],['five','faɪv'],['ice','aɪs'],['night','naɪt'],['smile','smaɪl']]},
      {key:'ow',label:'long O',symbol:'/oʊ/',color:'#3B85CC',words:[['boat','bot'],['road','rod'],['goat','got'],['note','not'],['home','hom'],['nose','noz'],['rose','roz'],['bone','bon'],['snow','sno'],['coat','kot']]},
      {key:'uw',label:'long U',symbol:'/juː/',color:'#D45A86',words:[['cube','kjub'],['cute','kjut'],['mule','mjul'],['use','juz'],['blue','blu'],['moon','mun'],['food','fud'],['June','dʒun'],['rule','rul'],['tube','tjub']]},
    ]
  },
  {
    id:'l-vs-r', category:'consonants', title:'L / R 辨音', subtitle:'L vs R',
    accent:'#6C5CE0', modes:['mix','classify','minimal'],
    classifyLabel:'L / R 分類', classifyPrompt:'看單字、聽發音，它的開頭是 L 還是 R？',
    targets:[
      {key:'l',label:'L 音',symbol:'/l/',color:'#6C5CE0',words:[['lice','laɪs'],['light','laɪt'],['lane','len'],['lead','lid'],['lock','lɑk'],['load','lod'],['lip','lɪp'],['lake','lek'],['late','let'],['lamp','læmp']]},
      {key:'r',label:'R 音',symbol:'/r/',color:'#E86A4E',words:[['rice','raɪs'],['right','raɪt'],['rain','ren'],['read','rid'],['rock','rɑk'],['road','rod'],['rip','rɪp'],['rake','rek'],['rate','ret'],['ramp','ræmp']]},
    ]
  },
];

/* ==================================================================
   ENGINE LAYER — 共用引擎 (unit-agnostic)
   ================================================================== */
const UMAP = Object.fromEntries(UNITS.map(u=>[u.id,u]));
const state = { voice:'female', rate:1.0, unit:null, mode:null, targetKey:null, qs:[], idx:0, score:0, wrong:[], answered:false };
let VF=null, VM=null, VANY=null, unlocked=false, audioCtx=null;

/* ---- speech ---- */
function loadVoices(){
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  const en=vs.filter(v=>/^en\b|-en|en[-_]/i.test(v.lang)||/english/i.test(v.name));
  const pool=en.length?en:vs;
  const fRe=/(female|zira|samantha|victoria|karen|moira|tessa|susan|linda|catherine|serena|fiona|amelie|joanna|salli|kimberly|allison|ava|nicky|google us english|woman)/i;
  const mRe=/(male|david|daniel|alex|fred|thomas|george|james|mark|guy|paul|matthew|oliver|arthur|rishi|man)/i;
  VF=pool.find(v=>fRe.test(v.name))||pool[0]||null;
  VM=pool.find(v=>mRe.test(v.name))||pool.find(v=>v!==VF)||pool[0]||null;
  VANY=pool[0]||vs[0]||null;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function unlock(){
  if(unlocked||!('speechSynthesis' in window)) return;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  unlocked=true;
}
document.addEventListener('pointerdown',unlock);
function speak(word){
  if(!('speechSynthesis' in window)) return; unlock();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word); u.lang='en-US'; u.rate=state.rate; u.pitch=1;
  const v=state.voice==='male'?(VM||VANY):(VF||VANY); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function tone(ok){
  if(!audioCtx) return; const now=audioCtx.currentTime;
  const notes=ok?[[660,0],[880,.09]]:[[300,0]];
  notes.forEach(([f,t])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.16,now+t+.02);g.gain.exponentialRampToValueAtTime(.0001,now+t+(ok?.18:.3));o.connect(g).connect(audioCtx.destination);o.start(now+t);o.stop(now+t+(ok?.2:.32));});
}
function setVoice(v){state.voice=v;document.getElementById('vf').classList.toggle('on',v==='female');document.getElementById('vm').classList.toggle('on',v==='male');}
function setRate(r){state.rate=parseFloat(r);document.getElementById('rateVal').textContent=state.rate.toFixed(1)+'x';}

/* ---- storage (graceful) ---- */
const MEM={};
function keyFor(unitId,mode,tk){return unitId+':'+mode+(tk?':'+tk:'');}
function getBest(k){try{const v=localStorage.getItem('ph_'+k);if(v!=null)return parseInt(v,10);}catch(e){}return MEM[k]||0;}
function setBest(k,val){if(val<=getBest(k))return;MEM[k]=val;try{localStorage.setItem('ph_'+k,String(val));}catch(e){}}

/* ---- helpers ---- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
function pad(a,n){const s=shuffle(a);while(s.length<n&&a.length)s.push(a[Math.random()*a.length|0]);return s.slice(0,n);}
const skel=w=>w.toLowerCase().replace(/[aeiou]/g,'');
function ham1(a,b){if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++){if(a[i]!==b[i]){d++;if(d>1)return false;}}return d===1;}
function editPair(a,b){if(a===b)return false;return ham1(a,b)||skel(a)===skel(b);}
function sim(t,o){let s=0;if(ham1(t.w,o.w))s+=90;if(skel(t.w)===skel(o.w))s+=70;if(t.w.slice(-1)===o.w.slice(-1))s+=24;if(t.w[0]===o.w[0])s+=14;if(t.w.length===o.w.length)s+=6;if(t.tk===o.tk)s-=30;return s;}
function unitWords(u){const a=[];u.targets.forEach(t=>t.words.forEach(([w,kk])=>a.push({w,kk,tk:t.key})));return a;}
function targetByKey(u,k){return u.targets.find(t=>t.key===k);}

/* ---- question generation (generic over any unit) ---- */
function mkWord(t,distract){return {type:'word',t,options:shuffle([t,...distract]).map(o=>o.w),answer:t.w};}
function buildQuestions(u,mode,tk){
  const all=unitWords(u); const qs=[];
  if(mode==='listen'){
    const own=all.filter(o=>o.tk===tk), others=all.filter(o=>o.tk!==tk);
    pad(own,10).forEach(t=>{qs.push(mkWord(t,[...pick(own.filter(o=>o.w!==t.w),2),...pick(others,1)]));});
  }else if(mode==='mix'){
    pad(all,10).forEach(t=>{qs.push(mkWord(t,pick(all.filter(o=>o.w!==t.w),3)));});
  }else if(mode==='classify'){
    pad(all,10).forEach(t=>{qs.push({type:'classify',t,options:u.targets.map(x=>x.key),answer:t.tk});});
  }else if(mode==='minimal'){
    const elig=all.filter(o=>all.some(p=>editPair(o.w,p.w)));
    pad(elig.length?elig:all,10).forEach(t=>{
      let d=pick(all.filter(o=>o.w!==t.w&&editPair(t.w,o.w)),3);
      if(d.length<3){
        const more=all.filter(o=>o.w!==t.w&&!d.some(x=>x.w===o.w)).map(o=>({o,s:sim(t,o)})).sort((a,b)=>b.s-a.s);
        for(const m of more){if(d.length>=3)break;d.push(m.o);}
      }
      qs.push(mkWord(t,d.slice(0,3)));
    });
  }
  return qs;
}

/* ---- flow ---- */
function start(mode,tk){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音合成 (Web Speech API)，建議改用 Chrome / Edge / Safari。');return;}
  state.mode=mode; state.targetKey=tk||null; state.idx=0; state.score=0; state.wrong=[]; state.answered=false;
  state.qs=buildQuestions(state.unit,mode,tk);
  const u=state.unit;
  let label;
  if(mode==='listen') label=`${u.title}・${targetByKey(u,tk).label}`;
  else if(mode==='mix') label=`${u.title}・綜合`;
  else if(mode==='classify') label=`${u.title}・${u.classifyLabel}`;
  else label=`${u.title}・最小對立音`;
  document.getElementById('qtag').textContent=label;
  show('quiz'); renderQ();
}
function retryWrong(){
  const u=state.unit;
  state.qs=state.wrong.map(({q})=>{
    const t=q.t;
    if(q.type==='classify') return {type:'classify',t,options:u.targets.map(x=>x.key),answer:t.tk};
    const all=unitWords(u);
    const d=all.filter(o=>o.w!==t.w).map(o=>({o,s:sim(t,o)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.o);
    return mkWord(t,d);
  });
  state.idx=0;state.score=0;state.wrong=[];state.answered=false;
  show('quiz');renderQ();
}
function renderQ(){
  const q=state.qs[state.idx], u=state.unit; state.answered=false;
  document.getElementById('qcount').textContent=`題目 ${state.idx+1} / ${state.qs.length}`;
  document.getElementById('pbar').style.width=(state.idx/state.qs.length*100)+'%';
  const fb=document.getElementById('feedback'); fb.className='feedback'; fb.innerHTML='';
  const sw=document.getElementById('showword'), prompt=document.getElementById('prompt'), opts=document.getElementById('opts');
  if(q.type==='classify'){
    sw.textContent=q.t.w; sw.classList.remove('hidden');
    prompt.textContent=u.classifyPrompt;
    opts.className=u.targets.length===5?'opts five':'opts';
    opts.innerHTML='';
    q.options.forEach((key,i)=>{
      const t=targetByKey(u,key), b=document.createElement('button');
      b.className='opt'; b.dataset.op=key; b.style.setProperty('--accent',t.color);
      b.innerHTML=`<span class="num">${i+1}</span><span style="color:${t.color}">${t.symbol}</span><span class="vlabel">${t.label}</span>`;
      b.onclick=()=>choose(key,b); opts.appendChild(b);
    });
  }else{
    sw.classList.add('hidden');
    prompt.textContent = state.mode==='minimal' ? '仔細聽——這些字很接近，選出你聽到的：' : '請專心聽聲音，點擊喇叭可重複發音：';
    opts.className='opts';
    opts.innerHTML='';
    q.options.forEach((w,i)=>{
      const b=document.createElement('button'); b.className='opt'; b.dataset.op=w;
      b.innerHTML=`<span class="num">${i+1}</span>${w}`; b.onclick=()=>choose(w,b); opts.appendChild(b);
    });
  }
  setTimeout(replay,300);
}
function replay(){speak(state.qs[state.idx].t.w);const s=document.getElementById('spk');s.classList.remove('ping');void s.offsetWidth;s.classList.add('ping');}
function choose(op,btn){
  if(state.answered) return; state.answered=true;
  const q=state.qs[state.idx], u=state.unit, correct=op===q.answer;
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.classList.add('locked');
    if(b.dataset.op===q.answer) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong'); else b.classList.add('dim');
  });
  if(correct){state.score++;tone(true);}else{state.wrong.push({q});tone(false);}
  document.getElementById('pbar').style.width=((state.idx+1)/state.qs.length*100)+'%';
  const t=targetByKey(u,q.t.tk), last=state.idx===state.qs.length-1;
  const fb=document.getElementById('feedback'); fb.className='feedback show '+(correct?'ok':'no');
  fb.innerHTML=`<div class="fic">${correct?'✓':'✕'}</div>
    <div class="ft">${correct?'答對了！':'再聽一次也沒關係～'}<small>正解：<b class="kk" style="color:${t.color};font-size:16px">${q.t.w}</b> <span class="kk">[${q.t.kk}]</span> — <b style="color:${t.color}">${t.label} ${t.symbol}</b></small></div>
    <div class="fbtns"><button class="mini" onclick="speak('${q.t.w}')">🔊 再聽</button><button class="next" onclick="nextQ()">${last?'看成績 →':'下一題 →'}</button></div>`;
}
function nextQ(){ if(state.idx<state.qs.length-1){state.idx++;renderQ();} else finish(); }
function finish(){
  const total=state.qs.length,sc=state.score,pct=Math.round(sc/total*100);
  setBest(keyFor(state.unit.id,state.mode,state.targetKey),sc);
  const msg=pct===100?'完美！全部答對 🎉':pct>=80?'很棒，快要滿分囉！':pct>=60?'不錯，多聽幾次會更準。':pct>=40?'繼續加油，抓住聲音的差別！':'別灰心，先從單字總表熟悉發音吧！';
  const circ=2*Math.PI*44,off=circ*(1-sc/total),u=state.unit;
  let review='';
  if(state.wrong.length){
    review=`<div class="review"><h4>錯題複習（${state.wrong.length}）</h4>`+state.wrong.map(({q})=>{
      const t=targetByKey(u,q.t.tk);
      return `<div class="rrow"><button class="rsp" onclick="speak('${q.t.w}')" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg></button><div><div class="rw">${q.t.w}</div><div class="rkk">[${q.t.kk}]</div></div><span class="rv" style="background:color-mix(in srgb,${t.color} 14%,#fff);color:${t.color}">${t.label} ${t.symbol}</span></div>`;
    }).join('')+`</div>`;
  }
  document.getElementById('result').innerHTML=`
    <div class="ring"><svg width="118" height="118"><circle cx="59" cy="59" r="44" stroke="#EDE7D8" stroke-width="11" fill="none"/><circle cx="59" cy="59" r="44" stroke="${pct>=80?'#2B9C6A':pct>=50?'#F5A623':'#E5556E'}" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s ease"/></svg><div class="val"><b>${sc}/${total}</b><span>答對率 ${pct}%</span></div></div>
    <h2>${msg}</h2><div class="msg">此模式最高分：${getBest(keyFor(state.unit.id,state.mode,state.targetKey))} / ${total}</div>
    ${review}
    <div class="rbtns">${state.wrong.length?`<button class="rs" onclick="retryWrong()">只練錯題 (${state.wrong.length})</button>`:''}<button class="rp" onclick="start(state.mode,state.targetKey)">再玩一次</button><button class="rg" onclick="backToUnit()">返回單元</button></div>`;
  show('result');
}

/* ---- navigation & menu rendering ---- */
function show(id){['home','unit','quiz','result'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'smooth'});}
function goHome(){if('speechSynthesis' in window)speechSynthesis.cancel();renderHome();show('home');}
function backToUnit(){if('speechSynthesis' in window)speechSynthesis.cancel();openUnit(state.unit.id);}
function key(e,fn){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}}

function renderHome(){
  const host=document.getElementById('catList'); host.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const units=UNITS.filter(u=>u.category===cat.id); if(!units.length) return;
    const head=document.createElement('div'); head.className='cat-head'; head.innerHTML=`<span>${cat.title}</span>`;
    host.appendChild(head);
    const g=document.createElement('div'); g.className='grid units';
    units.forEach(u=>{
      const c=document.createElement('div'); c.className='card'; c.tabIndex=0; c.setAttribute('role','button'); c.style.setProperty('--accent',u.accent);
      const syms=u.targets.map(t=>t.symbol).join('  ');
      c.innerHTML=`<span class="ipa">${u.subtitle}</span><h3>${u.title}</h3><div class="egs">${syms}</div><div class="best">${u.targets.length} 個音 · ${u.modes.length+1} 種模式</div>`;
      c.onclick=()=>openUnit(u.id); c.onkeydown=e=>key(e,()=>openUnit(u.id));
      g.appendChild(c);
    });
    host.appendChild(g);
  });
}

function openUnit(id){
  const u=UMAP[id]; state.unit=u; if('speechSynthesis' in window)speechSynthesis.cancel();
  document.getElementById('unitTag').textContent=u.subtitle;
  document.getElementById('unitTitle').textContent=u.title+' 練習';
  document.getElementById('unitSub').textContent='選一個音做聽辨練習，或挑戰下方的綜合／分類／辨音模式。';
  // target cards
  const tg=document.getElementById('targetGrid');
  tg.className='grid '+(u.targets.length===5?'g5':u.targets.length===2?'g2':'g5');
  tg.innerHTML='';
  u.targets.forEach(t=>{
    const egs=t.words.slice(0,3).map(w=>w[0]).join(', ')+'…';
    const c=document.createElement('div'); c.className='card'; c.tabIndex=0; c.setAttribute('role','button'); c.style.setProperty('--accent',t.color);
    c.innerHTML=`<span class="ipa">${t.symbol}</span><h3>${t.label}</h3><div class="egs">${egs}</div><div class="best">最高得分 <b>${getBest(keyFor(u.id,'listen',t.key))} / 10</b></div>`;
    c.onclick=()=>start('listen',t.key); c.onkeydown=e=>key(e,()=>start('listen',t.key));
    tg.appendChild(c);
  });
  // mode banners
  const modeMeta={
    mix:{ic:'⚡',title:'綜合聽力大挑戰',desc:'從整個單元混合出題，考驗綜合辨識。',grad:'linear-gradient(100deg,#7C5CE0,#9A6BF2)'},
    classify:{ic:'🔤',title:u.classifyLabel,desc:'看單字、聽發音，判斷它屬於哪一個音。',grad:'linear-gradient(100deg,#1F9E7A,#37B58E)'},
    minimal:{ic:'🎧',title:'最小對立音辨音',desc:'只差一點點的字放在一起，專練聽辨。',grad:'linear-gradient(100deg,#E86A4E,#F0925E)'},
  };
  const mr=document.getElementById('modeRow'); mr.innerHTML='';
  const list=u.modes.filter(m=>modeMeta[m]);
  list.forEach((m,i)=>{
    const meta=modeMeta[m];
    const b=document.createElement('div'); b.className='banner'; b.tabIndex=0; b.setAttribute('role','button'); b.style.background=meta.grad;
    b.style.marginTop = (i===0?'12px':'10px');
    b.innerHTML=`<div class="ic">${meta.ic}</div><div class="tx"><h3>${meta.title}</h3><p>${meta.desc}</p></div><div class="sc">${getBest(keyFor(u.id,m,null))} / 10</div><div class="arw">›</div>`;
    b.onclick=()=>start(m,null); b.onkeydown=e=>key(e,()=>start(m,null));
    mr.appendChild(b);
  });
  show('unit');
}

/* ---- word list modal (renders current unit) ---- */
function openList(){
  const u=state.unit; document.getElementById('listTitle').textContent=`${u.title} 單字對照總表`;
  const c=document.getElementById('mcols'); c.style.gridTemplateColumns=`repeat(${Math.min(u.targets.length,5)},1fr)`; c.innerHTML='';
  u.targets.forEach(t=>{
    const col=document.createElement('div'); col.className='mcol'; col.style.setProperty('--accent',t.color);
    col.innerHTML=`<h4>${t.label} ${t.symbol}</h4>`+t.words.map(([w,kk])=>`<div class="wline" onclick="speak('${w}')"><span class="w">${w}</span><span class="kk">[${kk}]</span><span class="sp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></span></div>`).join('');
    c.appendChild(col);
  });
  document.getElementById('overlay').classList.add('show');
}
function closeList(){document.getElementById('overlay').classList.remove('show');}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{
  if(document.getElementById('overlay').classList.contains('show')){if(e.key==='Escape')closeList();return;}
  if(document.getElementById('quiz').classList.contains('hidden')) return;
  if((e.key==='r'||e.key==='R'||e.code==='Space')&&!state.answered){e.preventDefault();replay();return;}
  if(!state.answered&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('#opts .opt')[+e.key-1];if(b)b.click();}
  else if(state.answered&&e.key==='Enter'){nextQ();}
});

/* ---- init ---- */
renderHome();
if(!('speechSynthesis' in window)){
  const w=document.createElement('div'); w.className='warn';
  w.textContent='提醒：此瀏覽器不支援 Web Speech API，發音功能將無法使用。建議改用 Chrome、Edge 或 Safari。';
  document.querySelector('#home .hero').after(w);
}
</script>
